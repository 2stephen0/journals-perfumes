[build]
  publish = "public"
[functions]
  directory = "netlify/functions"
  included_files = ["templates/**"]
[dev]
  framework = "#static"
  publish = "public"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
